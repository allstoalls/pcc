[project]
name = "python-cc"
version = "0.1.8"
description = "A Python-authored compiler toolchain that compiles C and Python to native code with its own backend."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["c", "python", "compiler", "self-hosting", "bootstrap", "ply"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: C",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx>=0.32.0"]

[project.urls]
Homepage = "https://github.com/allstoalls/pcc"

[project.scripts]
pcc = "pcc.driver.cli_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["projects/", "c_tests/", "tests/"]

[tool.hatch.build.targets.wheel]
packages = ["pcc", "utils"]
# Make sure non-.py files needed by the runtime build / lazy first-run
# rebuild are part of the wheel. hatchling auto-includes the package
# directory tree, but we list these explicitly so future moves don't
# silently drop them.
include = [
    "pcc/runtime/src/**",
    "pcc/runtime/include/**",
    "pcc/runtime/py/**",
    "pcc/runtime/Makefile",
]

# Wheel-build hook in hatch_build.py:
#  - compiles pcc/runtime → libpy_runtime_pcc_py.a (soft-fail: lazy
#    first-run path in pcc.frontends.python.pipeline can rebuild)
#  - self-compiles pcc/__main__.py → native `pcc1` bootstrap helper, shipped
#    via .data/scripts/pcc1. The public `pcc` command remains a Python launcher
#    for the full cli_core path.
# Defaults to --backend self (no cc/clang). The wheel becomes
# platform-tagged because it now contains a native binary.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-n 6 --dist=loadgroup -m 'not integration'"
testpaths = ["tests"]
norecursedirs = ["projects", "build", "build_py", "build_pcc", "build_libpython", "refs_docs", "_tmp_*"]
markers = [
    "integration: expensive end-to-end integration tests excluded from the default test run",
    "intent: AGENTS.md design-intent constraint locks (fast source/contract-level checks)",
    "pcc_gate(env=, dep=, probe=, unavailable=): opt-in/hardware gate; deselected at collection when the env var is unset, the dependency is missing, the probe fails, or the tool is unavailable. A selected test whose gate is unmet fails instead of skipping",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "click",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]
